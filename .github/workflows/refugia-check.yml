# Refugia — manual check only
# No schedule. No automatic runs. No evolve cycles.
# Structural + full organs including loop and witness.
# Failure noisy. Success quiet. Residual seed intact.
name: Refugia check

on:
  workflow_dispatch:
    inputs:
      note:
        description: "Optional note for this check"
        required: false
        default: "full organs + loop + witness"
      wire:
        description: "Run full path (true/false)"
        required: false
        default: "true"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Structural presence
        run: |
          set -euo pipefail
          test -f README.md
          test -f CHARTER.md
          test -f refugia/engines.py
          test -f refugia/oracle.py
          test -f refugia/society.py
          test -f refugia/twin.py
          test -f refugia/bus.py
          test -f refugia/loop.py
          test -f refugia/witness.py
          test -f society/systems/roles.md
          echo "Structure present"
          echo "Note: ${{ github.event.inputs.note }}"

      - name: Install engines
        if: ${{ github.event.inputs.wire == 'true' }}
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Full path including loop and witness
        if: ${{ github.event.inputs.wire == 'true' }}
        run: |
          set -euo pipefail
          python scripts/wire_check.py
          python scripts/oracle_demo.py
          python scripts/society_cycle.py
          python scripts/twin_demo.py
          python scripts/loop_demo.py
          python scripts/witness_demo.py
          echo "::notice::Full path completed. Status retained. Residual seed intact. No auto-evolve."
