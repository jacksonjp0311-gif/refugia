# Refugia — manual check only
# No schedule. No automatic runs. No evolve cycles.
# Structural + wiring + Oracle verification.
# Failure noisy. Success quiet. Residual seed intact.
name: Refugia check

on:
  workflow_dispatch:
    inputs:
      note:
        description: "Optional note for this check"
        required: false
        default: "structural + wiring + oracle"
      wire:
        description: "Run engine wiring and Oracle demo (true/false)"
        required: false
        default: "true"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Structural presence
        run: |
          set -euo pipefail
          test -f README.md
          test -f CHARTER.md
          test -f refugia/engines.py
          test -f refugia/oracle.py
          test -f scripts/wire_check.py
          test -f scripts/oracle_demo.py
          echo "Structure present"
          echo "Note: ${{ github.event.inputs.note }}"

      - name: Install engines
        if: ${{ github.event.inputs.wire == 'true' }}
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Wiring check
        if: ${{ github.event.inputs.wire == 'true' }}
        run: |
          set -euo pipefail
          python scripts/wire_check.py

      - name: Oracle demo (status retained, receipts append-only)
        if: ${{ github.event.inputs.wire == 'true' }}
        run: |
          set -euo pipefail
          python scripts/oracle_demo.py
          echo "::notice::Oracle demo completed. Status labels retained. Receipts append-only. No evolve. Residual seed intact."
