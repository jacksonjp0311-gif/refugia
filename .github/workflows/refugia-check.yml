# Refugia — manual check only
# No schedule. No automatic runs. No evolve cycles.
# Structural + wiring + Oracle + society decision.
# Failure noisy. Success quiet. Residual seed intact.
name: Refugia check

on:
  workflow_dispatch:
    inputs:
      note:
        description: "Optional note for this check"
        required: false
        default: "structural + wiring + oracle + society"
      wire:
        description: "Run full wiring, Oracle, and society cycle (true/false)"
        required: false
        default: "true"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Structural presence
        run: |
          set -euo pipefail
          test -f README.md
          test -f CHARTER.md
          test -f refugia/engines.py
          test -f refugia/oracle.py
          test -f refugia/society.py
          test -f scripts/wire_check.py
          test -f scripts/oracle_demo.py
          test -f scripts/society_cycle.py
          echo "Structure present"
          echo "Note: ${{ github.event.inputs.note }}"

      - name: Install engines
        if: ${{ github.event.inputs.wire == 'true' }}
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Wiring check
        if: ${{ github.event.inputs.wire == 'true' }}
        run: python scripts/wire_check.py

      - name: Oracle demo
        if: ${{ github.event.inputs.wire == 'true' }}
        run: python scripts/oracle_demo.py

      - name: Society cycle (propose → verify → decide; status retained)
        if: ${{ github.event.inputs.wire == 'true' }}
        run: |
          set -euo pipefail
          python scripts/society_cycle.py
          echo "::notice::Society cycle completed. Decisions respect status. No auto-promotion. Residual seed intact."
