# Refugia — manual check only
# No schedule. No automatic runs. No evolve cycles.
# Structural + full organs including proposer, loop, witness, authorize.
# Failure noisy. Success quiet. Residual seed intact.
name: Refugia check

on:
  workflow_dispatch:
    inputs:
      note:
        description: "Optional note for this check"
        required: false
        default: "closed path"
      wire:
        description: "Run full path (true/false)"
        required: false
        default: "true"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Structural presence
        run: |
          set -euo pipefail
          test -f README.md
          test -f CHARTER.md
          test -f refugia/engines.py
          test -f refugia/oracle.py
          test -f refugia/society.py
          test -f refugia/authorize.py
          test -f refugia/proposer.py
          test -f refugia/twin.py
          test -f refugia/bus.py
          test -f refugia/loop.py
          test -f refugia/witness.py
          test -f society/systems/roles.md
          echo "Structure present"
          echo "Note: ${{ github.event.inputs.note }}"

      - name: Install engines
        if: ${{ github.event.inputs.wire == 'true' }}
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Closed path: propose → loop → witness → authorize check
        if: ${{ github.event.inputs.wire == 'true' }}
        run: |
          set -euo pipefail
          python scripts/propose_demo.py
          python scripts/loop_demo.py
          python scripts/witness_demo.py
          python scripts/authorize_demo.py
          echo "::notice::Closed path completed. Keep is candidate only. Human flag required. Residual seed intact. No auto-evolve."
